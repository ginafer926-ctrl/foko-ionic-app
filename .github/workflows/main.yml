name: Compilar APK FoKo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias y compilar app web
        run: |
          npm install --legacy-peer-deps
          npx ng build

      - name: Preparar proyecto nativo Android con Capacitor
        run: |
          mkdir -p www
          FOUND_INDEX=$(find . -maxdepth 4 -name "index.html" ! -path "./src/*" ! -path "./node_modules/*" ! -path "./android/*" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
            BUILD_DIR=$(dirname "$FOUND_INDEX")
            if [ "$BUILD_DIR" != "./www" ] && [ "$BUILD_DIR" != "www" ]; then
              cp -r "$BUILD_DIR"/* www/
            fi
          fi
          ls -la www
          npx cap add android
          npx cap sync android

      - name: Aceptar licencias y generar APK debug
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          java -version
          javac -version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: FoKo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
